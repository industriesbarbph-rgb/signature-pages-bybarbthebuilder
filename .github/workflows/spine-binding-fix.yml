name: One-shot spine binding fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch reflected flap binding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          anchor = "function drawSpreadBase(){drawPage(leftImg,0,'left');drawPage(rightImg,PW,'right')}"
          helper = anchor + "\nfunction clipOutsideBinding(bind){ctx.beginPath();ctx.rect(-PW,-H,PW*2-bind,H*3);ctx.rect(PW+bind,-H,PW*2,H*3);ctx.clip()}"
          if anchor not in s:
              raise SystemExit('drawSpreadBase anchor not found')
          s = s.replace(anchor, helper, 1)

          replacements = [
              ("ctx.save();polyClip(reflected);const sw=", "ctx.save();clipOutsideBinding(bind);polyClip(reflected);const sw="),
              ("ctx.save();ctx.transform(a,b,c,d,e,f);polyClip(flap);ctx.drawImage(backImg,pageX,0,PW,H);ctx.restore();", "ctx.save();clipOutsideBinding(bind);ctx.transform(a,b,c,d,e,f);polyClip(flap);ctx.drawImage(backImg,pageX,0,PW,H);ctx.restore();"),
              ("ctx.save();polyClip(reflected);const fw=", "ctx.save();clipOutsideBinding(bind);polyClip(reflected);const fw="),
              ("ctx.save();polyClip(reflected);ctx.beginPath();", "ctx.save();clipOutsideBinding(bind);polyClip(reflected);ctx.beginPath();"),
          ]
          for a,b in replacements:
              if a not in s:
                  raise SystemExit(f'patch anchor missing: {a[:60]}')
              s = s.replace(a,b,1)

          p.write_text(s)
          PY
      - name: Verify syntax and patch
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          new Function(m[1]);
          if(!s.includes('function clipOutsideBinding(bind)')) throw new Error('binding clip missing');
          if((s.match(/clipOutsideBinding\(bind\)/g)||[]).length < 5) throw new Error('not all reflected layers protected');
          console.log('syntax and binding clip OK');
          NODE
      - name: Commit final fix and remove one-shot workflow
        run: |
          rm .github/workflows/spine-binding-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/spine-binding-fix.yml
          git commit -m "Protect reflected page at spine without changing curl"
          git push
