name: Build social preview image

on:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build-social-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate 1200x630 social preview
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path

          W,H=1200,630
          bg=Image.new('RGB',(W,H))
          p=bg.load()
          for y in range(H):
              for x in range(W):
                  dx=(x-W*0.5)/(W*0.62)
                  dy=(y-H*0.18)/(H*0.8)
                  r=(dx*dx+dy*dy)**0.5
                  glow=max(0,1-r)
                  t=y/(H-1)
                  base=(42*(1-t)+10*t,32*(1-t)+8*t,25*(1-t)+6*t)
                  p[x,y]=tuple(int(min(255,base[i]+glow*(22,17,12)[i])) for i in range(3))

          img=bg.convert('RGBA')
          shadow=Image.new('RGBA',(W,H),(0,0,0,0))
          sd=ImageDraw.Draw(shadow)
          sd.ellipse((310,500,890,585),fill=(0,0,0,135))
          shadow=shadow.filter(ImageFilter.GaussianBlur(20))
          img=Image.alpha_composite(img,shadow)

          layer=Image.new('RGBA',(W,H),(0,0,0,0))
          d=ImageDraw.Draw(layer)
          left,top,right,bottom=385,88,815,545
          d.rounded_rectangle((left+14,top+14,right+16,bottom+18),radius=18,fill=(226,214,196,255))
          for i in range(9):
              yy=bottom+4+i
              d.line((left+20,yy,right+9,yy),fill=(210+i*2,194+i*2,172+i*2,150),width=1)

          mask=Image.new('L',(W,H),0)
          md=ImageDraw.Draw(mask)
          md.rounded_rectangle((left,top,right,bottom),radius=20,fill=255)
          cover=Image.new('RGBA',(W,H),(0,0,0,0))
          cd=ImageDraw.Draw(cover)
          for yy in range(top,bottom+1):
              t=(yy-top)/(bottom-top)
              rr=int(117*(1-t)+77*t)
              gg=int(90*(1-t)+59*t)
              bb=int(68*(1-t)+46*t)
              cd.line((left,yy,right,yy),fill=(rr,gg,bb,255))
          cover.putalpha(mask)
          layer=Image.alpha_composite(layer,cover)
          d=ImageDraw.Draw(layer)
          d.rounded_rectangle((left,top,right,bottom),radius=20,outline=(196,171,144,85),width=2)
          d.rounded_rectangle((left+15,top+15,right-15,bottom-15),radius=14,outline=(232,215,193,52),width=2)
          d.rectangle((left+1,top+10,left+18,bottom-10),fill=(47,36,28,70))
          d.polygon([(left+35,top+18),(left+250,top+18),(left+110,bottom-20),(left+25,bottom-20)],fill=(255,255,255,9))

          font_candidates=[
              '/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf',
              '/usr/share/fonts/truetype/liberation2/LiberationSerif-Bold.ttf'
          ]
          regular_candidates=[
              '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf',
              '/usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf'
          ]
          bold=next(p for p in font_candidates if Path(p).exists())
          regular=next(p for p in regular_candidates if Path(p).exists())
          ft=ImageFont.truetype(bold,37)
          fb=ImageFont.truetype(regular,22)
          fs=ImageFont.truetype(regular,18)
          fd=ImageDraw.Draw(layer)
          text='Signature Pages\nTechnology'
          bbox=fd.multiline_textbbox((0,0),text,font=ft,spacing=8,align='center')
          tw=bbox[2]-bbox[0]
          th=bbox[3]-bbox[1]
          cx=(left+right)//2
          cy=(top+bottom)//2-22
          fd.multiline_text((cx-tw/2,cy-th/2),text,font=ft,fill=(241,228,209,255),spacing=8,align='center')
          by='by Barb The Builder'
          bb=fd.textbbox((0,0),by,font=fb)
          fd.text((cx-(bb[2]-bb[0])/2,cy+th/2+24),by,font=fb,fill=(230,214,191,235))
          img=Image.alpha_composite(img,layer)
          draw=ImageDraw.Draw(img)
          tag='A tactile digital book experience'
          tb=draw.textbbox((0,0),tag,font=fs)
          draw.text(((W-(tb[2]-tb[0]))/2,583),tag,font=fs,fill=(221,205,182,155))
          img.convert('RGB').save('social-preview.png','PNG',optimize=True)
          PY
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate social preview image"
          git push
