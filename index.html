<style>
:root{--paper:#f5ecdb;--paper2:#eadcc7;--ink:#31261c;--cover:#6b5542;--cover2:#4c3b2f}

.closed-book{position:absolute;left:50%;top:50%;width:52%;height:94%;transform:translate(-50%,-50%) perspective(1800px) rotateY(0deg);transform-origin:left center;z-index:60;border-radius:10px 14px 14px 10px;background:linear-gradient(112deg,rgba(255,255,255,.055),transparent 22%),repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),linear-gradient(145deg,#755b44,#554033 54%,#624a38);border:1px solid rgba(238,221,199,.22);box-shadow:9px 18px 32px rgba(0,0,0,.44),3px 0 0 #e7dccb,5px 0 0 #cfc0ad,inset 0 0 0 1px rgba(255,255,255,.045),inset 0 0 52px rgba(0,0,0,.17);display:flex;align-items:center;justify-content:center;color:#eee2d0;cursor:pointer;transition:transform 1320ms cubic-bezier(.18,.82,.14,1),opacity 180ms ease 1130ms,box-shadow 900ms ease;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:visible}

.page-stack-left,.page-stack-right{transition:width .45s ease,left .45s ease,right .45s ease,opacity .35s ease,box-shadow .45s ease}.page-stack-bottom{transition:transform .45s ease,opacity .35s ease}

<main class="seo-content" aria-label="About Signature Pages Technology"><h1>Signature Pages Technology by Barb The Builder</h1><p>A tactile digital book experience with realistic paper flex, weighted page curls, two-page spreads, full-screen page turning, and touch interaction across mobile, tablet, and desktop.</p></main>
<div class="stage"><div class="book-wrap awaiting-open" id="book"><div class="closed-book" id="closedBook" aria-label="Open book"><div class="cover-title"><span>Signature Pages Technology</span><small>by Barb The Builder</small></div></div><div class="close-edge" id="closeEdge" role="button" tabindex="0" aria-label="Tap or drag left to close book"></div><div class="cover"></div><div class="page-stack-left"></div><div class="page-stack-right"></div><div class="page-stack-bottom"></div><canvas id="pageCanvas"></canvas><div class="corner left"></div><div class="corner right"></div></div></div>
<script>
(()=>{
const canvas=document.getElementById('pageCanvas'),ctx=canvas.getContext('2d'),book=document.getElementById('book'),closedBook=document.getElementById('closedBook'),closeEdge=document.getElementById('closeEdge');
const leftStack=document.querySelector('.page-stack-left'),rightStack=document.querySelector('.page-stack-right'),bottomStack=document.querySelector('.page-stack-bottom');
let bookOpened=false,coverDrag=null,flexTimer=0,pendingPointer=null,W=0,H=0,PW=0,DPR=1,spread=0;const MAX_SPREADS=10;let drag=null,visualDrag=null,raf=0,anim=0,locked=false,landing=false,leftImg,rightImg,rightBackImg,leftBackImg,audioCtx=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,easeOut=t=>1-Math.pow(1-t,4.2),easeInOut=t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;
function pagePath(c,x,y,w,h,r,side){c.beginPath();if(side==='left'){c.moveTo(x+r,y);c.lineTo(x+w,y);c.lineTo(x+w,y+h);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r)}else{c.moveTo(x,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x,y+h)}c.closePath()}
function wrapText(c,text,maxW){const words=text.split(' '),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(c.measureText(test).width>maxW&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
function makePage(backside=false){const c=document.createElement('canvas');c.width=Math.max(2,Math.round(PW*DPR));c.height=Math.max(2,Math.round(H*DPR));const g=c.getContext('2d');g.scale(DPR,DPR);const bg=g.createLinearGradient(0,0,PW,H);bg.addColorStop(0,'#f8f0e1');bg.addColorStop(.54,'#f3ead9');bg.addColorStop(1,'#e9dcc7');g.fillStyle=bg;g.fillRect(0,0,PW,H);for(let i=0;i<220;i++){const x=Math.random()*PW,y=Math.random()*H,w=Math.random()*2.6+.35,h=Math.random()*.5+.12,rot=Math.random()*Math.PI;g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=`rgba(102,80,55,${Math.random()*.022})`;g.fillRect(-w/2,-h/2,w,h);g.restore()}const edge=g.createLinearGradient(0,0,PW,0);edge.addColorStop(0,'rgba(66,49,31,.018)');edge.addColorStop(.035,'rgba(0,0,0,0)');edge.addColorStop(.965,'rgba(0,0,0,0)');edge.addColorStop(1,'rgba(66,49,31,.018)');g.fillStyle=edge;g.fillRect(0,0,PW,H);g.textAlign='center';g.fillStyle='#33271c';const titleSize=Math.max(11,Math.min(PW*.043,H*.038,22)),bySize=Math.max(9,Math.min(PW*.031,H*.027,15));g.font=`500 ${titleSize}px Georgia, serif`;const titleLines=wrapText(g,'Signature Pages Technology',PW*.70),titleStep=titleSize*1.22,groupHeight=(titleLines.length-1)*titleStep+titleSize+bySize*1.7;let y=H*.50-groupHeight*.33;for(const line of titleLines){g.fillText(line,PW/2,y);y+=titleStep}g.font=`400 ${bySize}px Georgia, serif`;g.fillText('by Barb The Builder',PW/2,y+bySize*.55);if(backside){const m=document.createElement('canvas');m.width=c.width;m.height=c.height;const mg=m.getContext('2d');mg.translate(m.width,0);mg.scale(-1,1);mg.drawImage(c,0,0);return m}return c}
function rebuildImages(){leftImg=makePage(false);rightImg=makePage(false);rightBackImg=makePage(true);leftBackImg=makePage(true)}
function clipHalfPlane(poly,M,n,keepPositive){const out=[],inside=p=>((p.x-M.x)*n.x+(p.y-M.y)*n.y)*(keepPositive?1:-1)>=-0.001;for(let i=0;i<poly.length;i++){const A=poly[i],B=poly[(i+1)%poly.length],ia=inside(A),ib=inside(B);if(ia)out.push(A);if(ia!==ib){const da=(A.x-M.x)*n.x+(A.y-M.y)*n.y,db=(B.x-M.x)*n.x+(B.y-M.y)*n.y,t=da/(da-db);out.push({x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t})}}return out}
function polyClip(poly){ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i].x,poly[i].y);ctx.closePath();ctx.clip()}
function reflectPoint(p,M,n){const d=(p.x-M.x)*n.x+(p.y-M.y)*n.y;return{x:p.x-2*n.x*d,y:p.y-2*n.y*d}}
function drawPage(img,x,side=x===0?'left':'right'){ctx.save();pagePath(ctx,x,0,PW,H,4,side);ctx.clip();ctx.drawImage(img,x,0,PW,H);ctx.restore()}
function drawSpreadBase(){drawPage(leftImg,0,'left');drawPage(rightImg,PW,'right')}
function drawSpine(){const grd=ctx.createLinearGradient(PW-3,0,PW+3,0);grd.addColorStop(0,'rgba(48,34,22,0)');grd.addColorStop(.42,'rgba(48,34,22,.035)');grd.addColorStop(.5,'rgba(37,26,18,.14)');grd.addColorStop(.58,'rgba(48,34,22,.035)');grd.addColorStop(1,'rgba(48,34,22,0)');ctx.fillStyle=grd;ctx.fillRect(PW-3,0,6,H);ctx.fillStyle='rgba(35,25,17,.11)';ctx.fillRect(Math.floor(PW),0,1,H)}
function drawStaticSpread(){drawSpreadBase();drawSpine()}
function drawCurl(mode,D){drawSpreadBase();const nextMode=mode==='next',bind=Math.max(4,Math.min(7,PW*.012)),rect=nextMode?[{x:PW+bind,y:0},{x:W,y:0},{x:W,y:H},{x:PW+bind,y:H}]:[{x:0,y:0},{x:PW-bind,y:0},{x:PW-bind,y:H},{x:0,y:H}],corner=nextMode?{x:W,y:H}:{x:0,y:H};const dx=corner.x-D.x,dy=corner.y-D.y,dist=Math.hypot(dx,dy);if(dist<1.5){drawSpine();return}const n={x:dx/dist,y:dy/dist},M={x:(corner.x+D.x)/2,y:(corner.y+D.y)/2},flap=clipHalfPlane(rect,M,n,true),front=clipHalfPlane(rect,M,n,false),frontImg=nextMode?rightImg:leftImg,backImg=nextMode?rightBackImg:leftBackImg,pageX=nextMode?PW:0;let reflected=null;if(flap.length>=3){reflected=flap.map(p=>reflectPoint(p,M,n));ctx.save();polyClip(reflected);const sw=clamp(dist*.13,18,86),sh=ctx.createLinearGradient(M.x-n.x*sw,M.y-n.y*sw,M.x+n.x*sw,M.y+n.y*sw);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.44,'rgba(0,0,0,.02)');sh.addColorStop(.57,'rgba(0,0,0,.20)');sh.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sh;ctx.fillRect(0,0,W,H);ctx.restore()}if(front.length>=3){ctx.save();polyClip(front);ctx.drawImage(frontImg,pageX,0,PW,H);ctx.restore()}if(flap.length>=3){const dot=n.x*M.x+n.y*M.y,a=1-2*n.x*n.x,b=-2*n.x*n.y,c=-2*n.x*n.y,d=1-2*n.y*n.y,e=2*n.x*dot,f=2*n.y*dot;ctx.save();ctx.transform(a,b,c,d,e,f);polyClip(flap);ctx.drawImage(backImg,pageX,0,PW,H);ctx.restore();ctx.save();polyClip(reflected);const fw=clamp(dist*.18,28,122),foldLight=ctx.createLinearGradient(M.x-n.x*fw,M.y-n.y*fw,M.x+n.x*fw,M.y+n.y*fw);foldLight.addColorStop(0,'rgba(255,250,241,.01)');foldLight.addColorStop(.34,'rgba(255,248,238,.06)');foldLight.addColorStop(.49,'rgba(119,92,62,.09)');foldLight.addColorStop(.58,'rgba(73,53,33,.18)');foldLight.addColorStop(.80,'rgba(255,249,241,.02)');foldLight.addColorStop(1,'rgba(0,0,0,.045)');ctx.fillStyle=foldLight;ctx.fillRect(0,0,W,H);ctx.restore()}if(reflected&&reflected.length>=3){const len=Math.max(W,H)*2,tx=-n.y,ty=n.x;ctx.save();polyClip(reflected);ctx.beginPath();ctx.moveTo(M.x-tx*len,M.y-ty*len);ctx.lineTo(M.x+tx*len,M.y+ty*len);ctx.strokeStyle='rgba(62,46,30,.18)';ctx.lineWidth=1.7;ctx.stroke();ctx.beginPath();ctx.moveTo(M.x-tx*len+n.x,M.y-ty*len+n.y);ctx.lineTo(M.x+tx*len+n.x,M.y+ty*len+n.y);ctx.strokeStyle='rgba(255,250,241,.18)';ctx.lineWidth=.8;ctx.stroke();ctx.restore()}drawSpine()}
function drawLanding(mode){drawSpreadBase();if(mode==='next')drawPage(rightImg,0,'left');else drawPage(leftImg,PW,'right');drawSpine()}
function render(){ctx.clearRect(0,0,W,H);if(landing){drawLanding(landing);return}const state=drag||visualDrag;if(state)drawCurl(state.mode,state.display);else drawStaticSpread()}
function resize(){const r=book.getBoundingClientRect();W=Math.max(2,r.width);H=Math.max(2,r.height);PW=W/2;DPR=Math.min(2,window.devicePixelRatio||1.5);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);rebuildImages();render()}
function updatePageStacks(){const denom=Math.max(1,MAX_SPREADS-1),t=clamp(spread/denom,0,1),leftW=3+15*t,rightW=18-15*t;leftStack.style.width=`${leftW}px`;rightStack.style.width=`${rightW}px`;leftStack.style.left=`${-(leftW-3)}px`;rightStack.style.right=`${-(rightW-3)}px`;leftStack.style.opacity=`${0.34+0.62*t}`;rightStack.style.opacity=`${0.34+0.62*(1-t)}`;leftStack.style.boxShadow=`-${Math.max(2,leftW*.28)}px 0 ${Math.max(5,leftW*.6)}px rgba(0,0,0,.14)`;rightStack.style.boxShadow=`${Math.max(2,rightW*.28)}px 0 ${Math.max(5,rightW*.6)}px rgba(0,0,0,.14)`;bottomStack.style.transform=`scaleY(${.78+.22*Math.max(t,1-t)})`}
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function coverSound(){const ac=getAudio(),now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(58,now);o.frequency.exponentialRampToValueAtTime(44,now+.42);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.045,now+.06);g.gain.exponentialRampToValueAtTime(.0001,now+.46);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+.5)}
function pageSound(dir=1){const ac=getAudio(),now=ac.currentTime,dur=.62,len=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,len,ac.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++){const t=i/len,env=Math.sin(Math.PI*t)*Math.pow(1-t,.22),grain=Math.random()*2-1,silk=(Math.sin(i*.033)+Math.sin(i*.013))*.09;data[i]=(grain*.34+silk)*env}const src=ac.createBufferSource();src.buffer=buf;const filt=ac.createBiquadFilter();filt.type='bandpass';filt.frequency.value=dir>0?980:900;filt.Q.value=.58;const g=ac.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.14,now+.07);g.gain.exponentialRampToValueAtTime(.0001,now+dur);src.connect(filt).connect(g).connect(ac.destination);src.start(now)}
function resetClosedBookInline(){closedBook.style.display='flex';closedBook.style.transition='';closedBook.style.transform='';closedBook.style.opacity='';closedBook.style.pointerEvents='';closedBook.querySelector('.cover-title').style.opacity=''}
function openBook(){if(bookOpened||coverDrag)return;resetClosedBookInline();bookOpened=true;coverSound();book.classList.remove('cover-dragging');book.classList.add('opened');setTimeout(()=>book.classList.remove('awaiting-open'),180)}
function coverPose(progress){const p=clamp(progress,0,1),angle=-162*(1-p),shift=-1*(1-p);return `translate(-50%,-50%) perspective(1800px) rotateY(${angle}deg) translateX(${shift}%)`}
function startClose(e){if(!bookOpened||locked||drag||visualDrag||landing||coverDrag)return;const r=book.getBoundingClientRect();coverDrag={startX:e.clientX,currentX:e.clientX,width:r.width,progress:0,pointerId:e.pointerId,moved:false};try{if(e.pointerId!=null)closeEdge.setPointerCapture(e.pointerId)}catch(_){}closedBook.style.display='flex';closedBook.style.transition='none';closedBook.style.opacity='1';closedBook.style.pointerEvents='none';closedBook.style.transform=coverPose(0);closedBook.querySelector('.cover-title').style.opacity='0';book.classList.add('cover-dragging');e.preventDefault?.()}
function moveClose(e){if(!coverDrag)return;coverDrag.currentX=e.clientX;if(Math.abs(coverDrag.startX-e.clientX)>10)coverDrag.moved=true;const dx=coverDrag.startX-e.clientX,p=clamp(dx/(coverDrag.width*.43),0,1);coverDrag.progress=p;closedBook.style.transform=coverPose(p);closedBook.querySelector('.cover-title').style.opacity=String(clamp((p-.64)/.36,0,1));e.preventDefault?.()}
function finishClose(){if(!coverDrag)return;const p=coverDrag.progress,pointerId=coverDrag.pointerId,moved=coverDrag.moved,commit=!moved||p>.20;try{if(pointerId!=null&&closeEdge.hasPointerCapture(pointerId))closeEdge.releasePointerCapture(pointerId)}catch(_){}coverDrag=null;closedBook.style.display='flex';closedBook.style.opacity='1';closedBook.style.pointerEvents='none';closedBook.style.transition='transform 760ms cubic-bezier(.18,.82,.14,1), opacity 160ms ease, box-shadow 680ms ease';if(commit){coverSound();closedBook.style.transform=coverPose(1);closedBook.querySelector('.cover-title').style.opacity='1';setTimeout(()=>{bookOpened=false;book.classList.remove('opened','cover-dragging');book.classList.add('awaiting-open');closedBook.style.display='flex';closedBook.style.transform=coverPose(1);closedBook.style.opacity='1';closedBook.style.pointerEvents='auto';closedBook.style.transition='';closedBook.querySelector('.cover-title').style.opacity='1'},780)}else{closedBook.style.transform=coverPose(0);closedBook.querySelector('.cover-title').style.opacity='0';setTimeout(()=>{if(bookOpened){book.classList.remove('cover-dragging');resetClosedBookInline()}},780)}}
function cancelAnim(){if(anim){cancelAnimationFrame(anim);anim=0}}
function animatePoint(mode,from,to,dur,commit){cancelAnim();locked=true;visualDrag={mode,display:{...from}};drag=null;const start=performance.now();const tick=now=>{const t=clamp((now-start)/dur,0,1),e=commit?easeOut(t):easeInOut(t),arc=Math.sin(Math.PI*t)*(commit?H*.026:0);visualDrag.display.x=lerp(from.x,to.x,e);visualDrag.display.y=lerp(from.y,to.y,e)-arc;render();if(t<1){anim=requestAnimationFrame(tick);return}anim=0;if(commit){visualDrag=null;landing=mode;render();setTimeout(()=>{spread+=mode==='next'?1:-1;updatePageStacks();landing=false;locked=false;render()},190)}else{visualDrag=null;locked=false;render()}};anim=requestAnimationFrame(tick)}
function startDrag(mode,x,y){if(!bookOpened||locked)return;cancelAnim();getAudio();clearTimeout(flexTimer);const corner=mode==='next'?{x:W,y:H}:{x:0,y:H},flexX=corner.x+(mode==='next'?-11:11),flexY=H-10;pendingPointer={x,y};drag={mode,target:{x:flexX,y:flexY},display:{x:corner.x+(mode==='next'?-3:3),y:H-3},flexing:true};render();flexTimer=setTimeout(()=>{if(drag&&drag.mode===mode){drag.flexing=false;if(pendingPointer)drag.target={...pendingPointer}}},85)}
function releaseDrag(){if(!drag||locked)return;clearTimeout(flexTimer);flexTimer=0;pendingPointer=null;const mode=drag.mode,from={...drag.display},progress=mode==='next'?clamp((W-from.x)/W,0,1):clamp(from.x/W,0,1),commit=progress>.14;if(commit){pageSound(mode==='next'?1:-1);animatePoint(mode,from,mode==='next'?{x:0,y:H}:{x:W,y:H},980,true)}else animatePoint(mode,from,mode==='next'?{x:W,y:H}:{x:0,y:H},520,false)}
function smoothingLoop(){if(drag&&!locked){drag.display.x=lerp(drag.display.x,drag.target.x,.34);drag.display.y=lerp(drag.display.y,drag.target.y,.30);render()}raf=requestAnimationFrame(smoothingLoop)}
canvas.addEventListener('pointerdown',e=>{if(locked)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,right=x>W*.68&&y>H*.56,left=x<W*.32&&y>H*.56;if(right&&spread<MAX_SPREADS-1)startDrag('next',x,y);else if(left&&spread>0)startDrag('prev',x,y);else return;canvas.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});canvas.addEventListener('pointermove',e=>{if(!drag||locked)return;const r=canvas.getBoundingClientRect(),px=clamp(e.clientX-r.left,-PW*.12,W+PW*.12),py=clamp(e.clientY-r.top,H*.05,H);pendingPointer={x:px,y:py};if(!drag.flexing){drag.target.x=px;drag.target.y=py}e.preventDefault()},{passive:false});canvas.addEventListener('pointerup',e=>{releaseDrag();e.preventDefault()},{passive:false});canvas.addEventListener('pointercancel',releaseDrag);window.addEventListener('pointerup',releaseDrag,{passive:true});window.addEventListener('touchend',releaseDrag,{passive:true});window.addEventListener('touchcancel',releaseDrag,{passive:true});window.addEventListener('blur',()=>{if(drag&&!locked)releaseDrag()});window.addEventListener('keydown',e=>{if(!bookOpened||locked||drag)return;if(e.key==='ArrowRight'&&spread<MAX_SPREADS-1){pageSound(1);animatePoint('next',{x:W-20,y:H-15},{x:0,y:H},980,true)}if(e.key==='ArrowLeft'&&spread>0){pageSound(-1);animatePoint('prev',{x:20,y:H-15},{x:W,y:H},980,true)}});closeEdge.addEventListener('pointerdown',startClose,{passive:false});window.addEventListener('pointermove',moveClose,{passive:false});window.addEventListener('pointerup',finishClose,{passive:true});window.addEventListener('pointercancel',finishClose,{passive:true});closedBook.addEventListener('pointerdown',e=>{e.preventDefault();openBook()},{passive:false});closedBook.addEventListener('click',openBook);let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!drag&&!locked)resize()},160)});updatePageStacks();resize();smoothingLoop();
})();
