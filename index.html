<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Signature Pages Technology by Barb The Builder</title>
<style>
:root{
  --paper:#f5ecdb;
  --paper2:#eadcc7;
  --ink:#31261c;
  --cover:#6b5542;
  --cover2:#4c3b2f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  touch-action:none;
  background:
    radial-gradient(circle at 50% 15%,rgba(255,239,215,.07),transparent 26%),
    linear-gradient(180deg,#2b211a 0%,#16110d 52%,#090806 100%);
  font-family:Georgia,"Times New Roman",serif;
}
.stage{height:100%;display:grid;place-items:center;padding:3vh 2vw}
.book-wrap{
  position:relative;
  width:min(94vw,1040px,calc(72vh * 1.48));
  aspect-ratio:1.48/1;
  filter:drop-shadow(0 34px 34px rgba(0,0,0,.52));
}
.book-wrap::after{
  content:"";position:absolute;left:8%;right:8%;bottom:-8%;height:12%;
  background:radial-gradient(ellipse,rgba(0,0,0,.78),rgba(0,0,0,.12) 60%,transparent 76%);
  filter:blur(10px);transform:rotateX(76deg);pointer-events:none;z-index:-4;
}
.cover{
  position:absolute;inset:-15px -18px -22px -18px;z-index:-3;
  border-radius:13px 15px 16px 13px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.045),transparent 18%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px),
    linear-gradient(145deg,var(--cover),var(--cover2) 54%,#5e4938);
  border:1px solid rgba(235,216,193,.16);
  box-shadow:0 24px 42px rgba(0,0,0,.44),inset 0 0 0 1px rgba(255,255,255,.035),inset 0 0 56px rgba(0,0,0,.18);
}
.cover::after{content:"";position:absolute;inset:9px;border:1px solid rgba(241,228,209,.16);border-radius:8px}
.page-stack-left,.page-stack-right,.page-stack-bottom{
  position:absolute;z-index:-1;pointer-events:none;
  background:repeating-linear-gradient(0deg,#f3ebde 0 2px,#d5c5b1 2px 3px,#ece1d0 3px 5px,#e2d4c1 5px 6px);
}
.page-stack-left{left:-11px;top:12px;bottom:12px;width:14px;border-radius:7px 0 0 7px;box-shadow:-4px 0 8px rgba(0,0,0,.14)}
.page-stack-right{right:-11px;top:12px;bottom:12px;width:14px;border-radius:0 7px 7px 0;box-shadow:4px 0 8px rgba(0,0,0,.14)}
.page-stack-bottom{left:8px;right:8px;bottom:-11px;height:12px;border-radius:0 0 7px 7px;background:repeating-linear-gradient(90deg,#efe6d8 0 4px,#d8c8b6 4px 5px,#f4ecdf 5px 9px);box-shadow:0 5px 9px rgba(0,0,0,.15)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;border-radius:6px}
canvas:active{cursor:grabbing}
.corner{position:absolute;bottom:0;width:110px;height:110px;pointer-events:none;opacity:.15;transition:opacity .2s ease;z-index:3}
.corner.right{right:0}.corner.left{left:0;transform:scaleX(-1)}
.corner::before{content:"";position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(135deg,transparent 42%,rgba(255,251,244,.06) 66%,rgba(255,251,244,.13))}
.book-wrap:hover .corner{opacity:.26}

.book-wrap{transition:filter .7s ease}
.book-wrap.awaiting-open{filter:drop-shadow(0 28px 30px rgba(0,0,0,.48))}
.book-wrap.awaiting-open canvas,
.book-wrap.awaiting-open .page-stack-left,
.book-wrap.awaiting-open .page-stack-right,
.book-wrap.awaiting-open .page-stack-bottom,
.book-wrap.awaiting-open .corner,
.book-wrap.awaiting-open .cover{
  opacity:0;
}
.book-wrap.awaiting-open .page-stack-left,
.book-wrap.awaiting-open .page-stack-right,
.book-wrap.awaiting-open .page-stack-bottom{
  opacity:0 !important;
  visibility:hidden;
}
.book-wrap canvas,
.book-wrap .page-stack-left,
.book-wrap .page-stack-right,
.book-wrap .page-stack-bottom,
.book-wrap .corner,
.book-wrap .cover{
  transition:opacity .52s ease;
}
.closed-book{
  position:absolute;
  left:50%;top:50%;
  width:52%;height:94%;
  transform:translate(-50%,-50%) perspective(1800px) rotateY(0deg);
  transform-origin:left center;
  z-index:60;
  border-radius:10px 14px 14px 10px;
  background:
    linear-gradient(112deg,rgba(255,255,255,.055),transparent 22%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),
    linear-gradient(145deg,#755b44,#554033 54%,#624a38);
  border:1px solid rgba(238,221,199,.22);
  box-shadow:
    9px 18px 32px rgba(0,0,0,.44),
    3px 0 0 #e7dccb,
    5px 0 0 #cfc0ad,
    inset 0 0 0 1px rgba(255,255,255,.045),
    inset 0 0 52px rgba(0,0,0,.17);
  display:flex;align-items:center;justify-content:center;
  color:#eee2d0;
  cursor:pointer;
  transition:
    transform 1320ms cubic-bezier(.18,.82,.14,1),
    opacity 180ms ease 1130ms,
    box-shadow 900ms ease;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:visible;
}
.closed-book::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:15px;
  border-radius:10px 0 0 10px;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.04) 46%,rgba(0,0,0,.10));
  box-shadow:inset -4px 0 7px rgba(0,0,0,.12);
  pointer-events:none;
}
.closed-book::after{
  content:"";
  position:absolute;left:8px;right:3px;bottom:2px;height:5px;
  border-radius:0 0 7px 7px;
  background:repeating-linear-gradient(90deg,#eee4d5 0 5px,#d4c4b1 5px 6px,#f5ede1 6px 11px);
  box-shadow:0 1px 2px rgba(0,0,0,.12);
  pointer-events:none;
}
.closed-book .cover-title{
  position:relative;z-index:2;
  max-width:74%;
  text-align:center;
  color:#eee2d0;
  letter-spacing:.012em;
}
.closed-book .cover-title span{
  display:block;
  font:500 clamp(14px,1.38vw,21px)/1.25 Georgia,"Times New Roman",serif;
}
.closed-book .cover-title small{
  display:block;
  margin-top:.46em;
  font:400 clamp(10px,.92vw,14px)/1.2 Georgia,"Times New Roman",serif;
  letter-spacing:.025em;
}
.book-wrap.opened .closed-book{
  transform:translate(-50%,-50%) perspective(1800px) rotateY(-162deg) translateX(-1%);
  opacity:0;
  pointer-events:none;
  box-shadow:-18px 22px 30px rgba(0,0,0,.18);
}

.page-stack-left,.page-stack-right{
  transition:width .45s ease,left .45s ease,right .45s ease,opacity .35s ease,box-shadow .45s ease;
}
.page-stack-bottom{
  transition:transform .45s ease,opacity .35s ease;
}

.close-edge{
  position:absolute;right:-16px;top:10%;bottom:34%;width:30px;z-index:45;
  opacity:0;pointer-events:none;cursor:grab;touch-action:none;
  transition:opacity .22s ease;
}
.close-edge::before{
  content:"";position:absolute;right:4px;top:0;bottom:0;width:9px;border-radius:0 7px 7px 0;
  background:linear-gradient(90deg,#49382c,#6c5440 58%,#81634c);
  box-shadow:3px 0 7px rgba(0,0,0,.19),inset -1px 0 rgba(255,255,255,.07);
}
.book-wrap.opened .close-edge{opacity:.46;pointer-events:auto}
.book-wrap.cover-dragging .close-edge{opacity:0;pointer-events:none}
.corner-flex-note{display:none}

@media(max-width:760px){
  .stage{padding:2vh 1vw}
  .book-wrap{width:min(96vw,calc(74vh * 1.48));aspect-ratio:1.48/1}
  .cover{inset:-11px -12px -16px -12px}
  .page-stack-left{left:-8px}.page-stack-right{right:-8px}.page-stack-bottom{bottom:-8px;height:9px}
  .corner{width:86px;height:86px}
  .closed-book{width:52%;height:92%;border-radius:8px 11px 11px 8px;box-shadow:8px 16px 28px rgba(0,0,0,.42),3px 0 0 #e7dccb,5px 0 0 #cfc0ad,inset 0 0 0 1px rgba(255,255,255,.045),inset 0 0 52px rgba(0,0,0,.17)}
  .closed-book .cover-title{max-width:78%}
  .closed-book .cover-title span{font-size:clamp(11px,2.65vw,15px)}
  .closed-book .cover-title small{font-size:clamp(8px,1.95vw,11px);margin-top:.42em}
  .close-edge{right:-12px;width:26px;top:11%;bottom:36%}
}

@media (orientation:landscape) and (max-height:600px){
  .stage{padding:1.5vh 1vw}
  .book-wrap{width:min(92vw,calc(82vh * 1.48));aspect-ratio:1.48/1}
  .closed-book{height:90%}
  .corner{width:76px;height:76px}
}

</style>
</head>
<body>
<div class="stage">
  <div class="book-wrap awaiting-open" id="book">
    <div class="closed-book" id="closedBook" aria-label="Open book"><div class="cover-title"><span>Signature Pages Technology</span><small>by Barb The Builder</small></div></div>
    <div class="close-edge" id="closeEdge" aria-label="Drag left to close book"></div>
    <div class="cover"></div>
    <div class="page-stack-left"></div>
    <div class="page-stack-right"></div>
    <div class="page-stack-bottom"></div>
    <canvas id="pageCanvas"></canvas>
    <div class="corner left"></div>
    <div class="corner right"></div>
  </div>
</div>
<script>
(()=>{
  const canvas=document.getElementById('pageCanvas');
  const ctx=canvas.getContext('2d');
  const book=document.getElementById('book');
  const closedBook=document.getElementById('closedBook');
  const closeEdge=document.getElementById('closeEdge');
  const leftStack=document.querySelector('.page-stack-left');
  const rightStack=document.querySelector('.page-stack-right');
  const bottomStack=document.querySelector('.page-stack-bottom');
  let bookOpened=false;
  let coverDrag=null;
  let flexTimer=0;
  let pendingPointer=null;

  let W=0,H=0,PW=0,DPR=1;
  let spread=0;
  const MAX_SPREADS=10;
  let drag=null,visualDrag=null,raf=0,anim=0,locked=false,landing=false;
  let leftImg,rightImg,rightBackImg,leftBackImg;
  let audioCtx=null;

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const easeOut=t=>1-Math.pow(1-t,4.2);
  const easeInOut=t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;

  function roundRectPath(c,x,y,w,h,r){
    c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
  }
  function wrapText(c,text,maxW){
    const words=text.split(' '),lines=[];let line='';
    for(const word of words){const test=line?line+' '+word:word;if(c.measureText(test).width>maxW&&line){lines.push(line);line=word}else line=test}
    if(line)lines.push(line);return lines;
  }
  function makePage(backside=false){
    const c=document.createElement('canvas');c.width=Math.max(2,Math.round(PW*DPR));c.height=Math.max(2,Math.round(H*DPR));
    const g=c.getContext('2d');g.scale(DPR,DPR);
    const bg=g.createLinearGradient(0,0,PW,H);bg.addColorStop(0,'#f8f0e1');bg.addColorStop(.54,'#f3ead9');bg.addColorStop(1,'#e9dcc7');g.fillStyle=bg;g.fillRect(0,0,PW,H);
    // fibrous paper, intentionally diffuse, not glossy
    for(let i=0;i<260;i++){
      const x=Math.random()*PW,y=Math.random()*H,w=Math.random()*2.6+.35,h=Math.random()*.5+.12,rot=Math.random()*Math.PI;
      g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=`rgba(102,80,55,${Math.random()*.025})`;g.fillRect(-w/2,-h/2,w,h);g.restore();
    }
    const edge=g.createLinearGradient(0,0,PW,0);edge.addColorStop(0,'rgba(66,49,31,.05)');edge.addColorStop(.06,'rgba(0,0,0,0)');edge.addColorStop(.94,'rgba(0,0,0,0)');edge.addColorStop(1,'rgba(66,49,31,.04)');g.fillStyle=edge;g.fillRect(0,0,PW,H);
    g.textAlign='center';g.fillStyle='#33271c';
    const titleSize=Math.max(11,Math.min(PW*.043,H*.038,22));
    const bySize=Math.max(9,Math.min(PW*.031,H*.027,15));
    g.font=`500 ${titleSize}px Georgia, serif`;
    const titleLines=wrapText(g,'Signature Pages Technology',PW*.70);
    const titleStep=titleSize*1.22;
    const groupHeight=(titleLines.length-1)*titleStep + titleSize + bySize*1.7;
    let y=H*.50-groupHeight*.33;
    for(const line of titleLines){g.fillText(line,PW/2,y);y+=titleStep}
    g.font=`400 ${bySize}px Georgia, serif`;
    g.fillText('by Barb The Builder',PW/2,y+bySize*.55);
    if(backside){
      // pre-mirror the backside so the reflected fold reads upright when it lands
      const m=document.createElement('canvas');m.width=c.width;m.height=c.height;const mg=m.getContext('2d');mg.translate(m.width,0);mg.scale(-1,1);mg.drawImage(c,0,0);return m;
    }
    return c;
  }
  function rebuildImages(){leftImg=makePage(false);rightImg=makePage(false);rightBackImg=makePage(true);leftBackImg=makePage(true)}

  function clipHalfPlane(poly,M,n,keepPositive){
    const out=[];const inside=p=>((p.x-M.x)*n.x+(p.y-M.y)*n.y)*(keepPositive?1:-1)>=-0.001;
    for(let i=0;i<poly.length;i++){
      const A=poly[i],B=poly[(i+1)%poly.length],ia=inside(A),ib=inside(B);
      if(ia)out.push(A);
      if(ia!==ib){
        const da=(A.x-M.x)*n.x+(A.y-M.y)*n.y,db=(B.x-M.x)*n.x+(B.y-M.y)*n.y,t=da/(da-db);
        out.push({x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t});
      }
    }
    return out;
  }
  function polyClip(poly){ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i].x,poly[i].y);ctx.closePath();ctx.clip()}
  function reflectPoint(p,M,n){const d=(p.x-M.x)*n.x+(p.y-M.y)*n.y;return{x:p.x-2*n.x*d,y:p.y-2*n.y*d}}

  function drawPage(img,x){ctx.save();roundRectPath(ctx,x,0,PW,H,4);ctx.clip();ctx.drawImage(img,x,0,PW,H);ctx.restore()}
  function drawGutter(){
    const grd=ctx.createLinearGradient(PW-24,0,PW+24,0);grd.addColorStop(0,'rgba(73,54,35,0)');grd.addColorStop(.40,'rgba(73,54,35,.16)');grd.addColorStop(.50,'rgba(32,23,15,.30)');grd.addColorStop(.60,'rgba(255,250,242,.08)');grd.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=grd;ctx.fillRect(PW-26,0,52,H);
  }
  function drawStaticSpread(){
    drawPage(leftImg,0);drawPage(rightImg,PW);drawGutter();
  }

  function drawCurl(mode,D){
    // Underlying spread always stays visible.
    drawStaticSpread();

    const nextMode=mode==='next';
    const rect=nextMode
      ?[{x:PW,y:0},{x:W,y:0},{x:W,y:H},{x:PW,y:H}]
      :[{x:0,y:0},{x:PW,y:0},{x:PW,y:H},{x:0,y:H}];
    const corner=nextMode?{x:W,y:H}:{x:0,y:H};
    const dx=corner.x-D.x,dy=corner.y-D.y,dist=Math.hypot(dx,dy);
    if(dist<1.5)return;
    const n={x:dx/dist,y:dy/dist};
    const M={x:(corner.x+D.x)/2,y:(corner.y+D.y)/2};
    const flap=clipHalfPlane(rect,M,n,true);
    const front=clipHalfPlane(rect,M,n,false);
    const frontImg=nextMode?rightImg:leftImg;
    const backImg=nextMode?rightBackImg:leftBackImg;
    const pageX=nextMode?PW:0;

    // shadow projected by the lifted sheet onto the spread
    if(flap.length>=3){
      const reflected=flap.map(p=>reflectPoint(p,M,n));
      ctx.save();polyClip(reflected);
      const sw=clamp(dist*.13,18,86);
      const sh=ctx.createLinearGradient(M.x-n.x*sw,M.y-n.y*sw,M.x+n.x*sw,M.y+n.y*sw);
      sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.44,'rgba(0,0,0,.02)');sh.addColorStop(.57,'rgba(0,0,0,.20)');sh.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sh;ctx.fillRect(0,0,W,H);ctx.restore();
    }

    // Portion still lying flat on its original side.
    if(front.length>=3){
      ctx.save();polyClip(front);ctx.drawImage(frontImg,pageX,0,PW,H);ctx.restore();
    }

    // Reflected backside of the lifted sheet. The pre-mirrored source avoids reversed text.
    if(flap.length>=3){
      const dot=n.x*M.x+n.y*M.y;
      const a=1-2*n.x*n.x,b=-2*n.x*n.y,c=-2*n.x*n.y,d=1-2*n.y*n.y,e=2*n.x*dot,f=2*n.y*dot;
      ctx.save();ctx.transform(a,b,c,d,e,f);polyClip(flap);ctx.drawImage(backImg,pageX,0,PW,H);ctx.restore();

      const reflected=flap.map(p=>reflectPoint(p,M,n));
      ctx.save();polyClip(reflected);
      const fw=clamp(dist*.18,28,122);
      const foldLight=ctx.createLinearGradient(M.x-n.x*fw,M.y-n.y*fw,M.x+n.x*fw,M.y+n.y*fw);
      foldLight.addColorStop(0,'rgba(255,250,241,.01)');
      foldLight.addColorStop(.34,'rgba(255,248,238,.06)');
      foldLight.addColorStop(.49,'rgba(119,92,62,.09)');
      foldLight.addColorStop(.58,'rgba(73,53,33,.18)');
      foldLight.addColorStop(.80,'rgba(255,249,241,.02)');
      foldLight.addColorStop(1,'rgba(0,0,0,.045)');
      ctx.fillStyle=foldLight;ctx.fillRect(0,0,W,H);ctx.restore();
    }

    // traveling crease
    const len=Math.max(W,H)*2,tx=-n.y,ty=n.x;
    ctx.beginPath();ctx.moveTo(M.x-tx*len,M.y-ty*len);ctx.lineTo(M.x+tx*len,M.y+ty*len);ctx.strokeStyle='rgba(62,46,30,.18)';ctx.lineWidth=1.7;ctx.stroke();
    ctx.beginPath();ctx.moveTo(M.x-tx*len+n.x,M.y-ty*len+n.y);ctx.lineTo(M.x+tx*len+n.x,M.y+ty*len+n.y);ctx.strokeStyle='rgba(255,250,241,.18)';ctx.lineWidth=.8;ctx.stroke();
    drawGutter();
  }

  function drawLanding(mode){
    // Full page has landed on the opposite side. Keep it visible briefly before advancing.
    drawStaticSpread();
    if(mode==='next') drawPage(rightImg,0); else drawPage(leftImg,PW);
    const g=ctx.createLinearGradient(PW-34,0,PW+34,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.48,'rgba(46,33,22,.18)');g.addColorStop(.52,'rgba(255,250,240,.08)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(PW-36,0,72,H);
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    if(landing){drawLanding(landing);return}
    const state=drag||visualDrag;
    if(state)drawCurl(state.mode,state.display); else drawStaticSpread();
  }

  function resize(){
    const r=book.getBoundingClientRect();W=Math.max(2,r.width);H=Math.max(2,r.height);PW=W/2;DPR=Math.min(2,window.devicePixelRatio||1.5);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);rebuildImages();render();
  }

  function updatePageStacks(){
    const denom=Math.max(1,MAX_SPREADS-1);
    const t=clamp(spread/denom,0,1);
    const leftW=3+15*t;
    const rightW=18-15*t;
    leftStack.style.width=`${leftW}px`;
    rightStack.style.width=`${rightW}px`;
    leftStack.style.left=`${-(leftW-3)}px`;
    rightStack.style.right=`${-(rightW-3)}px`;
    leftStack.style.opacity=`${0.34+0.62*t}`;
    rightStack.style.opacity=`${0.34+0.62*(1-t)}`;
    leftStack.style.boxShadow=`-${Math.max(2,leftW*.28)}px 0 ${Math.max(5,leftW*.6)}px rgba(0,0,0,.14)`;
    rightStack.style.boxShadow=`${Math.max(2,rightW*.28)}px 0 ${Math.max(5,rightW*.6)}px rgba(0,0,0,.14)`;
    bottomStack.style.transform=`scaleY(${.78 + .22*Math.max(t,1-t)})`;
  }
  function coverSound(){
    const ac=getAudio(),now=ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(58,now);o.frequency.exponentialRampToValueAtTime(44,now+.42);
    g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.045,now+.06);g.gain.exponentialRampToValueAtTime(.0001,now+.46);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+.5);
    const len=Math.floor(ac.sampleRate*.52),buf=ac.createBuffer(1,len,ac.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<len;i++){const tt=i/len;data[i]=(Math.random()*2-1)*Math.sin(Math.PI*tt)*.12*Math.pow(1-tt,.25)}
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),sg=ac.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=720;sg.gain.value=.12;s.connect(f).connect(sg).connect(ac.destination);s.start(now+.06);
  }
  function resetClosedBookInline(){
    closedBook.style.display='flex';
    closedBook.style.transition='';
    closedBook.style.transform='';
    closedBook.style.opacity='';
    closedBook.style.pointerEvents='';
    closedBook.querySelector('.cover-title').style.opacity='';
  }
  function openBook(){
    if(bookOpened||coverDrag)return;
    resetClosedBookInline();
    bookOpened=true;
    coverSound();
    book.classList.remove('cover-dragging');
    book.classList.add('opened');
    setTimeout(()=>book.classList.remove('awaiting-open'),180);
    setTimeout(()=>{if(bookOpened&&!coverDrag)closedBook.style.display='none';},1450);
  }
  function coverPose(progress){
    const p=clamp(progress,0,1);
    const angle=-162*(1-p);
    const shift=-1*(1-p);
    return `translate(-50%,-50%) perspective(1800px) rotateY(${angle}deg) translateX(${shift}%)`;
  }
  function startClose(e){
    if(!bookOpened||locked||drag||visualDrag||landing||coverDrag)return;
    const r=book.getBoundingClientRect();
    coverDrag={startX:e.clientX,currentX:e.clientX,width:r.width,progress:0};
    closedBook.style.display='flex';
    closedBook.style.transition='none';
    closedBook.style.opacity='1';
    closedBook.style.pointerEvents='none';
    closedBook.style.transform=coverPose(0);
    closedBook.querySelector('.cover-title').style.opacity='0';
    book.classList.add('cover-dragging');
    e.preventDefault?.();
  }
  function moveClose(e){
    if(!coverDrag)return;
    coverDrag.currentX=e.clientX;
    const dx=coverDrag.startX-e.clientX;
    const p=clamp(dx/(coverDrag.width*.43),0,1);
    coverDrag.progress=p;
    closedBook.style.transform=coverPose(p);
    closedBook.querySelector('.cover-title').style.opacity=String(clamp((p-.64)/.36,0,1));
    e.preventDefault?.();
  }
  function finishClose(){
    if(!coverDrag)return;
    const p=coverDrag.progress;
    const commit=p>.34;
    coverDrag=null;
    closedBook.style.transition='transform 700ms cubic-bezier(.18,.82,.14,1), opacity 180ms ease, box-shadow 650ms ease';
    if(commit){
      coverSound();
      closedBook.style.transform=coverPose(1);
      closedBook.querySelector('.cover-title').style.opacity='1';
      setTimeout(()=>{
        bookOpened=false;
        book.classList.remove('opened','cover-dragging');
        book.classList.add('awaiting-open');
        resetClosedBookInline();
      },730);
    }else{
      closedBook.style.transform=coverPose(0);
      closedBook.querySelector('.cover-title').style.opacity='0';
      setTimeout(()=>{
        if(bookOpened){
          book.classList.remove('cover-dragging');
          closedBook.style.display='none';
          closedBook.style.transition='';
          closedBook.style.transform='';
          closedBook.style.opacity='';
          closedBook.style.pointerEvents='';
          closedBook.querySelector('.cover-title').style.opacity='';
        }
      },730);
    }
  }

  function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
  function pageSound(dir=1){
    const ac=getAudio(),now=ac.currentTime,dur=.62,len=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,len,ac.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<len;i++){const t=i/len,env=Math.sin(Math.PI*t)*Math.pow(1-t,.22),grain=Math.random()*2-1,silk=(Math.sin(i*.033)+Math.sin(i*.013))*0.09;data[i]=(grain*.34+silk)*env}
    const src=ac.createBufferSource();src.buffer=buf;const filt=ac.createBiquadFilter();filt.type='bandpass';filt.frequency.value=dir>0?980:900;filt.Q.value=.58;const g=ac.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.14,now+.07);g.gain.exponentialRampToValueAtTime(.0001,now+dur);src.connect(filt).connect(g).connect(ac.destination);src.start(now);
    const o=ac.createOscillator(),g2=ac.createGain();o.type='sine';o.frequency.value=64;g2.gain.setValueAtTime(.0001,now+.39);g2.gain.exponentialRampToValueAtTime(.035,now+.47);g2.gain.exponentialRampToValueAtTime(.0001,now+.60);o.connect(g2).connect(ac.destination);o.start(now+.37);o.stop(now+.62);
  }

  function cancelAnim(){if(anim){cancelAnimationFrame(anim);anim=0}}
  function animatePoint(mode,from,to,dur,commit){
    cancelAnim();locked=true;visualDrag={mode,display:{...from}};drag=null;const start=performance.now();
    const tick=now=>{
      const t=clamp((now-start)/dur,0,1),e=commit?easeOut(t):easeInOut(t);
      const arc=Math.sin(Math.PI*t)*(commit?H*.026:0);
      visualDrag.display.x=lerp(from.x,to.x,e);visualDrag.display.y=lerp(from.y,to.y,e)-arc;render();
      if(t<1){anim=requestAnimationFrame(tick);return}
      anim=0;
      if(commit){
        // Keep the fully landed paper on screen before advancing. No disappearing handoff.
        visualDrag=null;landing=mode;render();
        setTimeout(()=>{
          spread+=mode==='next'?1:-1;
          updatePageStacks();
          landing=false;locked=false;render();
        },190);
      }else{
        visualDrag=null;locked=false;render();
      }
    };
    anim=requestAnimationFrame(tick);
  }

  function startDrag(mode,x,y){
    if(!bookOpened||locked)return;cancelAnim();getAudio();
    clearTimeout(flexTimer);
    const corner=mode==='next'?{x:W,y:H}:{x:0,y:H};
    const flexX=corner.x+(mode==='next'?-11:11);
    const flexY=H-10;
    pendingPointer={x,y};
    // Tiny paper flex: the corner lifts first before following the drag.
    drag={mode,target:{x:flexX,y:flexY},display:{x:corner.x+(mode==='next'?-3:3),y:H-3},flexing:true};
    render();
    flexTimer=setTimeout(()=>{
      if(drag&&drag.mode===mode){
        drag.flexing=false;
        if(pendingPointer) drag.target={...pendingPointer};
      }
    },85);
  }
  function releaseDrag(){
    if(!drag||locked)return;
    clearTimeout(flexTimer);flexTimer=0;pendingPointer=null;
    const mode=drag.mode,from={...drag.display};
    const progress=mode==='next'?clamp((W-from.x)/W,0,1):clamp(from.x/W,0,1);
    const commit=progress>.14;
    if(commit){
      pageSound(mode==='next'?1:-1);
      // Exact final drag point makes the sheet land flat on the opposite page.
      const to=mode==='next'?{x:0,y:H}:{x:W,y:H};
      animatePoint(mode,from,to,980,true);
    }else{
      const to=mode==='next'?{x:W,y:H}:{x:0,y:H};
      animatePoint(mode,from,to,520,false);
    }
  }

  function smoothingLoop(){
    if(drag&&!locked){drag.display.x=lerp(drag.display.x,drag.target.x,.34);drag.display.y=lerp(drag.display.y,drag.target.y,.30);render()}
    raf=requestAnimationFrame(smoothingLoop);
  }

  canvas.addEventListener('pointerdown',e=>{
    if(locked)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    const right=x>W*.68&&y>H*.56,left=x<W*.32&&y>H*.56;
    if(right&&spread<MAX_SPREADS-1)startDrag('next',x,y);
    else if(left&&spread>0)startDrag('prev',x,y);
    else return;
    canvas.setPointerCapture?.(e.pointerId);e.preventDefault();
  },{passive:false});
  canvas.addEventListener('pointermove',e=>{
    if(!drag||locked)return;const r=canvas.getBoundingClientRect();
    const px=clamp(e.clientX-r.left,-PW*.12,W+PW*.12),py=clamp(e.clientY-r.top,H*.05,H);
    pendingPointer={x:px,y:py};
    if(!drag.flexing){drag.target.x=px;drag.target.y=py;}
    e.preventDefault();
  },{passive:false});
  canvas.addEventListener('pointerup',e=>{releaseDrag();e.preventDefault()},{passive:false});
  canvas.addEventListener('pointercancel',()=>{releaseDrag()});
  window.addEventListener('pointerup',releaseDrag,{passive:true});
  window.addEventListener('touchend',releaseDrag,{passive:true});
  window.addEventListener('touchcancel',releaseDrag,{passive:true});
  window.addEventListener('blur',()=>{if(drag&&!locked)releaseDrag()});
  window.addEventListener('keydown',e=>{
    if(!bookOpened||locked||drag)return;
    if(e.key==='ArrowRight'&&spread<MAX_SPREADS-1){pageSound(1);animatePoint('next',{x:W-20,y:H-15},{x:0,y:H},980,true)}
    if(e.key==='ArrowLeft'&&spread>0){pageSound(-1);animatePoint('prev',{x:20,y:H-15},{x:W,y:H},980,true)}
  });
  closeEdge.addEventListener('pointerdown',startClose,{passive:false});
  window.addEventListener('pointermove',moveClose,{passive:false});
  window.addEventListener('pointerup',finishClose,{passive:true});
  window.addEventListener('pointercancel',finishClose,{passive:true});
  window.addEventListener('touchend',()=>{if(coverDrag)finishClose()},{passive:true});
  window.addEventListener('touchcancel',()=>{if(coverDrag)finishClose()},{passive:true});
  closedBook.addEventListener('pointerdown',e=>{e.preventDefault();openBook();},{passive:false});
  closedBook.addEventListener('click',openBook);
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!drag&&!locked)resize()},160)});
  updatePageStacks();resize();smoothingLoop();
})();
</script>
</body>
</html>
